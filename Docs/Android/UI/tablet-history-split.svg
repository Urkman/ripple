<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 700" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Android tablet History split wireframe</title>
  <desc id="desc">An expanded Android History layout with navigation rail, month calendar, and persistent Day Detail pane.</desc>
  <rect width="1024" height="700" fill="#F4F7F8"/>
  <rect x="18" y="18" width="988" height="664" rx="28" fill="#FFFFFF" stroke="#B7C7CB" stroke-width="2"/>
  <rect x="34" y="34" width="112" height="632" rx="20" fill="#E8F4F6"/>
  <text x="90" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B3D4A">RIPPLE</text>
  <g font-family="sans-serif" font-size="12"><rect x="48" y="128" width="84" height="42" rx="12" fill="#FFFFFF"/><text x="90" y="154" text-anchor="middle" fill="#0B3D4A">Today</text><rect x="48" y="180" width="84" height="42" rx="12" fill="#1A7A8C"/><text x="90" y="206" text-anchor="middle" font-weight="700" fill="#FFFFFF">History</text><rect x="48" y="232" width="84" height="42" rx="12" fill="#FFFFFF"/><text x="90" y="258" text-anchor="middle" fill="#0B3D4A">Stats</text><rect x="48" y="284" width="84" height="42" rx="12" fill="#FFFFFF"/><text x="90" y="310" text-anchor="middle" fill="#0B3D4A">Settings</text></g>
  <line x1="162" y1="42" x2="162" y2="642" stroke="#B7C7CB"/>
  <text x="188" y="76" font-family="sans-serif" font-size="22" font-weight="700" fill="#0B3D4A">History</text><text x="188" y="101" font-family="sans-serif" font-size="11" fill="#52666C">Calendar pane remains visible beside Day Detail</text>
  <rect x="188" y="124" width="398" height="48" rx="14" fill="#E8F4F6"/><text x="214" y="154" font-family="sans-serif" font-size="14" fill="#0B3D4A">‹</text><text x="387" y="154" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0B3D4A">September 2026</text><text x="560" y="154" text-anchor="end" font-family="sans-serif" font-size="14" fill="#0B3D4A">›</text>
