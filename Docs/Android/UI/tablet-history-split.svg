  <g fill="none" stroke="#D5E2E4" stroke-width="5"><circle cx="226" cy="263" r="18"/><circle cx="283" cy="263" r="18"/><circle cx="340" cy="263" r="18"/><circle cx="397" cy="263" r="18"/><circle cx="454" cy="263" r="18"/><circle cx="511" cy="263" r="18"/><circle cx="226" cy="329" r="18"/><circle cx="283" cy="329" r="18"/><circle cx="340" cy="329" r="18"/><circle cx="397" cy="329" r="18"/><circle cx="454" cy="329" r="18"/><circle cx="511" cy="329" r="18"/><circle cx="226" cy="395" r="18"/><circle cx="283" cy="395" r="18"/><circle cx="340" cy="395" r="18"/><circle cx="397" cy="395" r="18"/><circle cx="454" cy="395" r="18"/><circle cx="511" cy="395" r="18"/></g>
