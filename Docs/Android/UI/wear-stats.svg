<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Wear Stats wireframe</title>
  <desc id="desc">A Wear-native current ISO-week summary with one compact chart and no period picker.</desc>
  <rect width="360" height="360" fill="#101B1E"/><text x="32" y="49" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Stats</text><text x="32" y="72" font-family="sans-serif" font-size="10" fill="#B7C7CB">Current ISO week · 7 days</text>
  <rect x="24" y="91" width="312" height="70" rx="16" fill="#1E3035"/><text x="42" y="117" font-family="sans-serif" font-size="10" fill="#B7C7CB">Average</text><text x="42" y="145" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">1.8 L</text><text x="210" y="117" font-family="sans-serif" font-size="10" fill="#B7C7CB">Goal days</text><text x="210" y="145" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">4 / 7</text>
  <text x="24" y="194" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">This week</text><rect x="24" y="207" width="312" height="94" rx="16" fill="#E8F4F6"/><line x1="43" y1="281" x2="316" y2="281" stroke="#B7C7CB"/><g fill="#4FB3C6"><rect x="57" y="249" width="22" height="32" rx="5"/><rect x="94" y="238" width="22" height="43" rx="5"/><rect x="131" y="258" width="22" height="23" rx="5"/><rect x="168" y="230" width="22" height="51" rx="5"/><rect x="205" y="244" width="22" height="37" rx="5"/><rect x="242" y="220" width="22" height="61" rx="5"/><rect x="279" y="255" width="22" height="26" rx="5"/></g><text x="180" y="324" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#B7C7CB">One compact chart · no Week/Month/Year picker</text><text x="180" y="345" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#B7C7CB">Wear-native horizontal page · swipe to Today or History</text>
</svg>
