<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Android phone History wireframe</title>
  <desc id="desc">A native Android month calendar with horizontal month paging, one progress ring per day, disabled future days, and a Day Detail destination.</desc>
  <rect width="360" height="780" fill="#F4F7F8"/>
  <rect x="10" y="8" width="340" height="764" rx="28" fill="#FFFFFF" stroke="#B7C7CB" stroke-width="2"/>
  <text x="28" y="46" font-family="sans-serif" font-size="20" font-weight="700" fill="#0B3D4A">History</text>
  <text x="28" y="72" font-family="sans-serif" font-size="11" fill="#52666C">Swipe horizontally to change month</text>
  <rect x="28" y="91" width="304" height="52" rx="16" fill="#E8F4F6"/>
  <text x="53" y="123" font-family="sans-serif" font-size="16" font-weight="700" fill="#0B3D4A">‹</text>
  <text x="180" y="123" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0B3D4A">September 2026</text>
  <text x="307" y="123" font-family="sans-serif" font-size="16" font-weight="700" fill="#0B3D4A">›</text>
  <text x="28" y="168" font-family="sans-serif" font-size="10" fill="#52666C">MON</text>
  <text x="78" y="168" font-family="sans-serif" font-size="10" fill="#52666C">TUE</text>
  <text x="128" y="168" font-family="sans-serif" font-size="10" fill="#52666C">WED</text>
  <text x="179" y="168" font-family="sans-serif" font-size="10" fill="#52666C">THU</text>
  <text x="230" y="168" font-family="sans-serif" font-size="10" fill="#52666C">FRI</text>
  <text x="280" y="168" font-family="sans-serif" font-size="10" fill="#52666C">SAT</text>
  <text x="323" y="168" text-anchor="end" font-family="sans-serif" font-size="10" fill="#52666C">SUN</text>
  <g fill="none" stroke="#D5E2E4" stroke-width="5">
    <circle cx="54" cy="210" r="15"/><circle cx="105" cy="210" r="15"/><circle cx="156" cy="210" r="15"/><circle cx="207" cy="210" r="15"/><circle cx="258" cy="210" r="15"/><circle cx="309" cy="210" r="15"/>
    <circle cx="54" cy="275" r="15"/><circle cx="105" cy="275" r="15"/><circle cx="156" cy="275" r="15"/><circle cx="207" cy="275" r="15"/><circle cx="258" cy="275" r="15"/><circle cx="309" cy="275" r="15"/>
    <circle cx="54" cy="340" r="15"/><circle cx="105" cy="340" r="15"/><circle cx="156" cy="340" r="15"/><circle cx="207" cy="340" r="15"/><circle cx="258" cy="340" r="15"/><circle cx="309" cy="340" r="15"/>
    <circle cx="54" cy="405" r="15"/><circle cx="105" cy="405" r="15"/><circle cx="156" cy="405" r="15"/><circle cx="207" cy="405" r="15"/><circle cx="258" cy="405" r="15"/><circle cx="309" cy="405" r="15"/>
  </g>
  <g fill="none" stroke="#1A7A8C" stroke-width="5" stroke-linecap="round">
    <path d="M54 210 A15 15 0 1 1 44 184"/><path d="M105 210 A15 15 0 1 1 91 204"/><path d="M156 275 A15 15 0 1 1 148 261"/><path d="M207 340 A15 15 0 1 1 193 334"/><path d="M258 405 A15 15 0 1 1 246 394"/>
  </g>
  <g font-family="sans-serif" font-size="9" fill="#0B3D4A" text-anchor="middle"><text x="54" y="214">1</text><text x="105" y="214">2</text><text x="156" y="214">3</text><text x="207" y="214">4</text><text x="258" y="214">5</text><text x="309" y="214">6</text><text x="54" y="279">7</text><text x="105" y="279">8</text><text x="156" y="279">9</text><text x="207" y="279">10</text><text x="258" y="279">11</text><text x="309" y="279">12</text><text x="54" y="344">14</text><text x="105" y="344">15</text><text x="156" y="344">16</text><text x="207" y="344">17</text><text x="258" y="344">18</text><text x="309" y="344">19</text><text x="54" y="409">21</text><text x="105" y="409">22</text><text x="156" y="409">23</text><text x="207" y="409">24</text><text x="258" y="409">25</text><text x="309" y="409">26</text></g>
  <rect x="28" y="466" width="304" height="92" rx="18" fill="#F4F7F8" stroke="#B7C7CB"/>
  <text x="44" y="493" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B3D4A">Selected day</text>
  <text x="44" y="516" font-family="sans-serif" font-size="11" fill="#52666C">Tap a past or current day to open Day Detail</text>
  <text x="44" y="539" font-family="sans-serif" font-size="11" fill="#1A7A8C">Future days are disabled · plus only for today</text>
  <text x="28" y="610" font-family="sans-serif" font-size="11" fill="#52666C">Material 3 HorizontalPager + calendar grid + Day Detail navigation</text>
  <line x1="28" y1="637" x2="332" y2="637" stroke="#B7C7CB"/>
  <text x="63" y="672" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52666C">Today</text><text x="145" y="672" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1A7A8C">History</text><text x="226" y="672" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52666C">Stats</text><text x="304" y="672" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52666C">Settings</text>
  <text x="28" y="724" font-family="sans-serif" font-size="10" fill="#0B3D4A">CONTRACT: calendar first, no Recent list</text>
</svg>
