<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Android phone Settings wireframe</title>
  <desc id="desc">A native Android Settings screen containing profile, goal, containers, reminders, Health, sync, export, and about sections.</desc>
  <rect width="360" height="780" fill="#F4F7F8"/>
  <rect x="10" y="8" width="340" height="764" rx="28" fill="#FFFFFF" stroke="#B7C7CB" stroke-width="2"/>
  <text x="28" y="48" font-family="sans-serif" font-size="20" font-weight="700" fill="#0B3D4A">Settings</text>
  <text x="28" y="74" font-family="sans-serif" font-size="11" fill="#52666C">Native list sections; no iOS table chrome</text>
  <g font-family="sans-serif">
    <rect x="28" y="96" width="304" height="54" rx="14" fill="#E8F4F6"/><circle cx="57" cy="123" r="17" fill="#4FB3C6"/><text x="57" y="128" text-anchor="middle" font-size="11" fill="#FFFFFF">AS</text><text x="84" y="120" font-size="12" font-weight="700" fill="#0B3D4A">Profile</text><text x="84" y="138" font-size="10" fill="#52666C">Alex · ml · 2,000 ml goal</text>
    <text x="28" y="180" font-size="11" font-weight="700" fill="#1A7A8C">DAILY GOAL</text><rect x="28" y="190" width="304" height="44" rx="12" fill="#FFFFFF" stroke="#B7C7CB"/><text x="44" y="217" font-size="12" fill="#0B3D4A">Goal calculation</text><text x="316" y="217" text-anchor="end" font-size="11" fill="#52666C">Health / manual ›</text>
    <text x="28" y="266" font-size="11" font-weight="700" fill="#1A7A8C">CONTAINERS</text><rect x="28" y="276" width="304" height="44" rx="12" fill="#FFFFFF" stroke="#B7C7CB"/><text x="44" y="303" font-size="12" fill="#0B3D4A">Glass · 250 ml</text><text x="316" y="303" text-anchor="end" font-size="18" fill="#1A7A8C">+</text><rect x="28" y="324" width="304" height="44" rx="12" fill="#FFFFFF" stroke="#B7C7CB"/><text x="44" y="351" font-size="12" fill="#0B3D4A">Bottle · 500 ml</text><text x="316" y="351" text-anchor="end" font-size="11" fill="#52666C">Edit</text>
    <text x="28" y="401" font-size="11" font-weight="700" fill="#1A7A8C">REMINDERS &amp; HEALTH</text><rect x="28" y="411" width="304" height="44" rx="12" fill="#FFFFFF" stroke="#B7C7CB"/><text x="44" y="438" font-size="12" fill="#0B3D4A">Reminders</text><rect x="285" y="422" width="33" height="20" rx="10" fill="#1A7A8C"/><circle cx="308" cy="432" r="8" fill="#FFFFFF"/><rect x="28" y="459" width="304" height="44" rx="12" fill="#FFFFFF" stroke="#B7C7CB"/><text x="44" y="486" font-size="12" fill="#0B3D4A">Health Connect</text><text x="316" y="486" text-anchor="end" font-size="11" fill="#1A7A8C">Connected ›</text>
    <text x="28" y="536" font-size="11" font-weight="700" fill="#1A7A8C">DATA</text><rect x="28" y="546" width="304" height="44" rx="12" fill="#FFFFFF" stroke="#B7C7CB"/><text x="44" y="573" font-size="12" fill="#0B3D4A">Sync status</text><text x="316" y="573" text-anchor="end" font-size="11" fill="#1A7A8C">Up to date</text><rect x="28" y="594" width="304" height="44" rx="12" fill="#FFFFFF" stroke="#B7C7CB"/><text x="44" y="621" font-size="12" fill="#0B3D4A">Export data</text><text x="316" y="621" text-anchor="end" font-size="18" fill="#1A7A8C">›</text>
    <text x="28" y="673" font-size="11" font-weight="700" fill="#1A7A8C">ABOUT</text><text x="28" y="700" font-size="11" fill="#52666C">Ripple · version · license · privacy</text>
  </g>
  <line x1="28" y1="719" x2="332" y2="719" stroke="#B7C7CB"/><text x="63" y="749" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52666C">Today</text><text x="145" y="749" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52666C">History</text><text x="226" y="749" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#52666C">Stats</text><text x="304" y="749" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1A7A8C">Settings</text>
</svg>
