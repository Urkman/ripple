<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Wear Today wireframe</title>
  <desc id="desc">A Wear-native Today screen using the full canvas as a flat water-level field, with predefined actions and rotary custom amount.</desc>
  <rect width="360" height="360" fill="#101B1E"/><circle cx="180" cy="180" r="154" fill="#E8F4F6" stroke="#4FB3C6" stroke-width="4"/><path d="M29 190 Q100 176 180 190 T331 190 L331 334 Q180 354 29 334 Z" fill="#4FB3C6" opacity="0.85"/><text x="180" y="118" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0B3D4A">1,250 ml</text><text x="180" y="143" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0B3D4A">62% · 750 ml left</text><circle cx="104" cy="261" r="31" fill="#1A7A8C"/><circle cx="180" cy="261" r="31" fill="#1A7A8C"/><circle cx="256" cy="261" r="31" fill="#1A7A8C"/><text x="104" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">+250</text><text x="180" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">+500</text><text x="256" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">+750</text><text x="180" y="323" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0B3D4A">Crown: adjust custom amount · tap to confirm</text><text x="180" y="346" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#B7C7CB">Wear-native page · no pour stream · no tilt</text>
</svg>
