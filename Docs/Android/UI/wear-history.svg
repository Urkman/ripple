<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Wear History wireframe</title>
  <desc id="desc">A Wear-native seven-day history list with elapsed local days and one progress ring per row.</desc>
  <rect width="360" height="360" fill="#101B1E"/><text x="32" y="49" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">History</text><text x="32" y="72" font-family="sans-serif" font-size="10" fill="#B7C7CB">Last seven elapsed local days</text>
  <g font-family="sans-serif"><rect x="24" y="91" width="312" height="32" rx="12" fill="#1E3035"/><circle cx="47" cy="107" r="9" fill="none" stroke="#4FB3C6" stroke-width="3"/><text x="68" y="111" font-size="11" fill="#FFFFFF">Today</text><text x="316" y="111" text-anchor="end" font-size="11" fill="#4FB3C6">1.8 L</text><rect x="24" y="129" width="312" height="32" rx="12" fill="#1E3035"/><circle cx="47" cy="145" r="9" fill="none" stroke="#1A7A8C" stroke-width="3"/><text x="68" y="149" font-size="11" fill="#FFFFFF">Yesterday</text><text x="316" y="149" text-anchor="end" font-size="11" fill="#B7C7CB">2.0 L</text><rect x="24" y="167" width="312" height="32" rx="12" fill="#1E3035"/><circle cx="47" cy="183" r="9" fill="none" stroke="#4FB3C6" stroke-width="3"/><text x="68" y="187" font-size="11" fill="#FFFFFF">Sat, 5 Sep</text><text x="316" y="187" text-anchor="end" font-size="11" fill="#B7C7CB">1.4 L</text><rect x="24" y="205" width="312" height="32" rx="12" fill="#1E3035"/><circle cx="47" cy="221" r="9" fill="none" stroke="#1A7A8C" stroke-width="3"/><text x="68" y="225" font-size="11" fill="#FFFFFF">Fri, 4 Sep</text><text x="316" y="225" text-anchor="end" font-size="11" fill="#B7C7CB">2.1 L</text><rect x="24" y="243" width="312" height="32" rx="12" fill="#1E3035"/><circle cx="47" cy="259" r="9" fill="none" stroke="#4FB3C6" stroke-width="3"/><text x="68" y="263" font-size="11" fill="#FFFFFF">Thu, 3 Sep</text><text x="316" y="263" text-anchor="end" font-size="11" fill="#B7C7CB">1.7 L</text><rect x="24" y="281" width="312" height="32" rx="12" fill="#1E3035"/><circle cx="47" cy="297" r="9" fill="none" stroke="#1A7A8C" stroke-width="3"/><text x="68" y="301" font-size="11" fill="#FFFFFF">Wed, 2 Sep</text><text x="316" y="301" text-anchor="end" font-size="11" fill="#B7C7CB">2.0 L</text></g>
  <text x="180" y="340" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#B7C7CB">Tap a row for Wear Day Detail · no month calendar</text>
</svg>
