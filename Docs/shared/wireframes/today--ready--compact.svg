  <text x="40" y="116" font-size="18" class="muted">Tuesday, 17 September</text>
  <rect x="40" y="150" width="560" height="440" rx="34" class="surface"/>
  <path d="M78 420 Q320 390 562 420 L562 550 Q320 570 78 550 Z" class="water"/>
  <text x="320" y="260" text-anchor="middle" font-size="44" font-weight="700">1 250 ml</text>
  <text x="320" y="294" text-anchor="middle" font-size="22" class="muted">62 % · Ziel 2 000 ml</text>
  <text x="320" y="470" text-anchor="middle" font-size="20" class="muted">contained water level</text>
  <text x="40" y="630" font-size="22" font-weight="600">Noch 750 ml</text>
  <text x="40" y="658" font-size="17" class="muted">remaining amount and goal status</text>
  <rect x="40" y="700" width="174" height="84" rx="16" class="accent"/>
  <rect x="233" y="700" width="174" height="84" rx="16" class="accent"/>
  <rect x="426" y="700" width="174" height="84" rx="16" class="accent"/>
  <text x="127" y="735" text-anchor="middle" font-size="19" font-weight="600">Glas</text><text x="127" y="764" text-anchor="middle" font-size="17">250 ml</text>
  <text x="320" y="735" text-anchor="middle" font-size="19" font-weight="600">Tasse</text><text x="320" y="764" text-anchor="middle" font-size="17">350 ml</text>
  <text x="513" y="735" text-anchor="middle" font-size="19" font-weight="600">Flasche</text><text x="513" y="764" text-anchor="middle" font-size="17">500 ml</text>
  <rect x="40" y="812" width="560" height="70" rx="14" class="surface"/>
