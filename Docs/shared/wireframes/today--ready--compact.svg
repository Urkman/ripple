<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960">
  <desc>Ripple Today, ready compact wireframe, surface contract 1.1.0.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #16333b; }
    .muted { fill: #648087; } .surface { fill: #fff; stroke: #a9c7cc; stroke-width: 2; }
    .accent { fill: #dceff2; stroke: #348b99; stroke-width: 2; }
    .water { fill: #c5ebf0; stroke: #5caab4; stroke-width: 2; }
    .dash { fill: none; stroke: #7aa5ab; stroke-width: 2; stroke-dasharray: 8 7; }
  </style>
  <rect width="640" height="960" fill="#f5fafb"/>
