<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 700" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Android tablet Stats wireframe</title>
  <desc id="desc">An expanded Android Stats screen with navigation rail, period selector, summaries, and four chart regions.</desc>
  <rect width="1024" height="700" fill="#F4F7F8"/><rect x="18" y="18" width="988" height="664" rx="28" fill="#FFFFFF" stroke="#B7C7CB" stroke-width="2"/>
  <rect x="34" y="34" width="112" height="632" rx="20" fill="#E8F4F6"/><text x="90" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B3D4A">RIPPLE</text><g font-family="sans-serif" font-size="12"><rect x="48" y="128" width="84" height="42" rx="12" fill="#FFFFFF"/><text x="90" y="154" text-anchor="middle" fill="#0B3D4A">Today</text><rect x="48" y="180" width="84" height="42" rx="12" fill="#FFFFFF"/><text x="90" y="206" text-anchor="middle" fill="#0B3D4A">History</text><rect x="48" y="232" width="84" height="42" rx="12" fill="#1A7A8C"/><text x="90" y="258" text-anchor="middle" font-weight="700" fill="#FFFFFF">Stats</text><rect x="48" y="284" width="84" height="42" rx="12" fill="#FFFFFF"/><text x="90" y="310" text-anchor="middle" fill="#0B3D4A">Settings</text></g>
  <line x1="162" y1="42" x2="162" y2="642" stroke="#B7C7CB"/><text x="188" y="76" font-family="sans-serif" font-size="22" font-weight="700" fill="#0B3D4A">Stats</text><text x="188" y="101" font-family="sans-serif" font-size="11" fill="#52666C">Separate feature screen; no History/Insights merge</text>
  <rect x="188" y="124" width="764" height="44" rx="14" fill="#E8F4F6"/><rect x="191" y="127" width="246" height="38" rx="11" fill="#1A7A8C"/><text x="314" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Week</text><text x="570" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0B3D4A">Month</text><text x="824" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0B3D4A">Year</text>
  <rect x="188" y="190" width="238" height="88" rx="16" fill="#E8F4F6"/><rect x="451" y="190" width="238" height="88" rx="16" fill="#E8F4F6"/><rect x="714" y="190" width="238" height="88" rx="16" fill="#E8F4F6"/><g font-family="sans-serif"><text x="208" y="218" font-size="11" fill="#52666C">Average</text><text x="208" y="253" font-size="26" font-weight="700" fill="#0B3D4A">1.8 L</text><text x="471" y="218" font-size="11" fill="#52666C">Goal days</text><text x="471" y="253" font-size="26" font-weight="700" fill="#0B3D4A">4 / 7</text><text x="734" y="218" font-size="11" fill="#52666C">Best day</text><text x="734" y="253" font-size="26" font-weight="700" fill="#0B3D4A">2.4 L</text></g>
  <rect x="188" y="304" width="370" height="142" rx="16" fill="#FFFFFF" stroke="#B7C7CB"/><rect x="582" y="304" width="370" height="142" rx="16" fill="#FFFFFF" stroke="#B7C7CB"/><text x="208" y="333" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B3D4A">Daily intake</text><path d="M210 414 L252 387 L294 400 L336 362 L378 383 L420 346 L500 370" fill="none" stroke="#1A7A8C" stroke-width="4"/><line x1="210" y1="414" x2="526" y2="414" stroke="#D5E2E4"/><text x="602" y="333" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B3D4A">Goal completion</text><g fill="#4FB3C6"><rect x="613" y="383" width="25" height="31" rx="5"/><rect x="662" y="366" width="25" height="48" rx="5"/><rect x="711" y="350" width="25" height="64" rx="5"/><rect x="760" y="375" width="25" height="39" rx="5"/><rect x="809" y="340" width="25" height="74" rx="5"/></g>
  <rect x="188" y="470" width="370" height="118" rx="16" fill="#E8F4F6"/><rect x="582" y="470" width="370" height="118" rx="16" fill="#E8F4F6"/><text x="208" y="500" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B3D4A">Weekday pattern</text><path d="M210 556 Q250 506 292 549 T374 528 T500 544" fill="none" stroke="#1A7A8C" stroke-width="4"/><text x="602" y="500" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B3D4A">Cumulative trend &amp; highlights</text><text x="602" y="532" font-family="sans-serif" font-size="11" fill="#52666C">Most consistent: Tuesday</text><text x="602" y="554" font-family="sans-serif" font-size="11" fill="#52666C">Strongest morning start</text><text x="188" y="628" font-family="sans-serif" font-size="11" fill="#52666C">Material 3 NavigationRail · adaptive chart grid · standard scrolling</text>
</svg>
