<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Wear Day Detail wireframe</title>
  <desc id="desc">A Wear-native day detail list where individual intake rows can be deleted.</desc>
  <rect width="360" height="360" fill="#101B1E"/><text x="28" y="45" font-family="sans-serif" font-size="14" fill="#4FB3C6">‹</text><text x="57" y="45" font-family="sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Today</text><text x="30" y="68" font-family="sans-serif" font-size="10" fill="#B7C7CB">1,250 ml · 62% · 750 ml left</text>
  <g font-family="sans-serif"><rect x="24" y="90" width="312" height="42" rx="13" fill="#1E3035"/><text x="40" y="110" font-size="11" fill="#FFFFFF">10:14 · Glass</text><text x="40" y="125" font-size="9" fill="#B7C7CB">250 ml · device</text><text x="315" y="114" text-anchor="end" font-size="16" fill="#4FB3C6">⋮</text><rect x="24" y="140" width="312" height="42" rx="13" fill="#1E3035"/><text x="40" y="160" font-size="11" fill="#FFFFFF">09:02 · Bottle</text><text x="40" y="175" font-size="9" fill="#B7C7CB">500 ml · Watch</text><text x="315" y="164" text-anchor="end" font-size="16" fill="#4FB3C6">⋮</text><rect x="24" y="190" width="312" height="42" rx="13" fill="#1E3035"/><text x="40" y="210" font-size="11" fill="#FFFFFF">07:45 · Custom</text><text x="40" y="225" font-size="9" fill="#B7C7CB">500 ml · Siri</text><text x="315" y="214" text-anchor="end" font-size="16" fill="#4FB3C6">⋮</text></g>
  <rect x="24" y="252" width="312" height="38" rx="14" fill="#1A7A8C"/><text x="180" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Delete selected entry</text><text x="180" y="318" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#B7C7CB">Standard confirmation · individual delete only</text><text x="180" y="341" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#B7C7CB">Wear-native page · no batch dashboard</text>
</svg>
