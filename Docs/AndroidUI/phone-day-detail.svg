<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" role="img" aria-labelledby="title desc">
  <title id="title">Ripple Android phone Day Detail wireframe</title>
  <desc id="desc">A nested Android Day Detail screen with total, progress, intake rows, edit and delete actions, and an add action only for today.</desc>
  <rect width="360" height="780" fill="#F4F7F8"/>
  <rect x="10" y="8" width="340" height="764" rx="28" fill="#FFFFFF" stroke="#B7C7CB" stroke-width="2"/>
  <text x="28" y="47" font-family="sans-serif" font-size="14" fill="#1A7A8C">‹</text>
  <text x="58" y="47" font-family="sans-serif" font-size="19" font-weight="700" fill="#0B3D4A">Monday, 8 Sep</text>
  <text x="28" y="78" font-family="sans-serif" font-size="12" fill="#52666C">Day Detail · nested from History</text>
  <rect x="28" y="104" width="304" height="124" rx="20" fill="#E8F4F6"/>
  <text x="48" y="135" font-family="sans-serif" font-size="12" fill="#52666C">Consumed</text>
  <text x="48" y="174" font-family="sans-serif" font-size="32" font-weight="700" fill="#0B3D4A">1,250 ml</text>
  <text x="48" y="199" font-family="sans-serif" font-size="12" fill="#0B3D4A">62% of 2,000 ml goal · 750 ml remaining</text>
  <rect x="28" y="253" width="304" height="48" rx="16" fill="#1A7A8C"/>
  <text x="180" y="283" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">+ Add intake</text>
  <text x="28" y="343" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B3D4A">Entries</text>
  <g>
    <rect x="28" y="358" width="304" height="62" rx="14" fill="#FFFFFF" stroke="#B7C7CB"/>
    <text x="46" y="384" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B3D4A">10:14 · Glass</text><text x="46" y="404" font-family="sans-serif" font-size="11" fill="#52666C">250 ml · device</text><text x="302" y="394" text-anchor="end" font-family="sans-serif" font-size="16" fill="#1A7A8C">⋮</text>
    <rect x="28" y="430" width="304" height="62" rx="14" fill="#FFFFFF" stroke="#B7C7CB"/>
    <text x="46" y="456" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B3D4A">09:02 · Bottle</text><text x="46" y="476" font-family="sans-serif" font-size="11" fill="#52666C">500 ml · Watch</text><text x="302" y="466" text-anchor="end" font-family="sans-serif" font-size="16" fill="#1A7A8C">⋮</text>
    <rect x="28" y="502" width="304" height="62" rx="14" fill="#FFFFFF" stroke="#B7C7CB"/>
    <text x="46" y="528" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B3D4A">07:45 · Custom</text><text x="46" y="548" font-family="sans-serif" font-size="11" fill="#52666C">500 ml · Siri</text><text x="302" y="538" text-anchor="end" font-family="sans-serif" font-size="16" fill="#1A7A8C">⋮</text>
  </g>
  <text x="28" y="603" font-family="sans-serif" font-size="11" fill="#52666C">Edit, delete, and restore use standard dialogs and undo snackbar.</text>
  <text x="28" y="626" font-family="sans-serif" font-size="11" fill="#52666C">For a past day, the add action is hidden or disabled.</text>
  <text x="28" y="674" font-family="sans-serif" font-size="11" fill="#1A7A8C">Material 3 TopAppBar · ListItem · DropdownMenu · Snackbar</text>
  <text x="28" y="724" font-family="sans-serif" font-size="10" fill="#0B3D4A">CONTRACT: tap a day opens detail; never a separate replacement root</text>
</svg>
